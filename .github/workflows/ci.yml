name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Without this the workflow runs with the
# repository's default token scope, which on older repos is
# write-all — far more than any of these jobs needs.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://portal_app:portal_app@localhost:5432/portal
      DATABASE_SYNC_URL: postgresql+psycopg://portal:portal@localhost:5432/portal
      DATABASE_OWNER_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install poppler (PDF thumbnails)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap portal_app role
        env:
          PGPASSWORD: portal
        run: |
          psql -h localhost -U portal -d portal -f docker/postgres-init.sql

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Type gate. app/ was at 0 errors for months, regressed to 1 with
      # nothing to notice it (audit BE-11) — keep it at 0.
      - name: Mypy
        run: uv run mypy app/

      - name: Run migrations against Postgres
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v --cov=app --cov-report=term-missing

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sme-client-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
