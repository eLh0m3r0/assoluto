# Weekly dependency PRs. Grouped so a solo operator gets at most one PR
# per ecosystem per week instead of a dozen. Every PR runs CI; nothing
# reaches production until it is merged to main and fast-forwarded.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Actions are pinned to commit SHAs (supply-chain hardening, audit
  # 2026-07-26 F-19); Dependabot bumps the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
